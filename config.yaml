# Central config. Thresholds here are PLACEHOLDERS — they get tuned on a train split in
# Session 3/4 and must never be tuned on the test split. All randomness uses `seed`.

seed: 42

paths:
  raw: data/raw
  variants: data/variants
  manifest: data/manifest/manifest.csv

audio:
  target_sample_rate: 16000   # resample everything to this
  mono: true

features:
  frame_length_s: 0.025
  hop_length_s: 0.010
  f0_min_hz: 65
  f0_max_hz: 400
  n_mfcc: 13
  silence_rel_db: -35.0   # frames this many dB below peak RMS count as silence
  min_pause_s: 0.15       # silences shorter than this are not reported as pauses

# Controlled-variant generators (Session 3). Severity 0..1 = subtle..obvious.
# These are KNOBS the owner can tune by hand; same `seed` (top of file) => same output.
variants:
  seg_len_s: 2.0              # length of the region rate/pitch transforms act on
  region_min_s: 2.0          # earliest a transform may start (avoid leading silence)
  region_pad_end_s: 3.0      # keep this much clear at the clip's end
  long_pause:
    severities: [0.25, 0.5, 0.75, 1.0]
    pause_s_at_sev1: 2.0     # severity 1.0 => insert this many seconds of silence (linear)
  rate_deviation:
    severities: [0.25, 0.5, 0.75, 1.0]
    factor_at_sev1: 0.5      # severity 1.0 => segment plays at this speed ratio (0.5 = 2x faster/rushed)
  monotone:
    severities: [0.25, 0.5, 0.75, 1.0]
    # flatten factor k = 1 - severity (k=0 at sev 1.0 => fully monotone; k=1 => unchanged)

# Placeholder detection thresholds — TO BE TUNED on train split, verified on held-out.
# All three detectors are SPEAKER-NORMALIZED: they compare the candidate to the same
# speaker's baseline, so these are deviation knobs, not absolute cutoffs.
detection:
  long_pause_s: 0.8            # (Session 1 slice only) absolute long-pause cutoff
  long_pause_excess_s: 0.2     # TUNED on train (Session 6b-4): F1 0.86 across 0.1–0.3 (tie),
                               # chose the conservative middle. Flag a pause this many
                               # seconds longer than the baseline's LONGEST natural pause.
  # Session 6b honest rate rule: compare the SAME words in candidate vs baseline.
  rate_speedup_ratio: 0.25     # TUNED on train (6b-4): F1 0.86 across 0.2–0.25 (tie), chose
                               # 0.25. Flag a word-run whose candidate duration is >= this
                               # fraction shorter than the baseline said it (cand/base <= 0.8).
  rate_min_words: 3            # the rushed run must be at least this many consecutive words
  # Fallback energy-proxy path (used only when no transcript/alignment is available):
  rate_window_s: 1.0           # sliding-window length for local syllable rate
  rate_hop_s: 0.25             # how far that window steps each reading
  rate_deviation_ratio: 0.35   # flag a window > this fraction above baseline's fastest rate
  monotone_f0_std_ratio: 0.7   # TUNED on train (6b-4): F1 0.84 (best; vs 0.80 at 0.5–0.65).
                               # Flag a word-run whose candidate pitch std is <= this * the
                               # baseline's std for the SAME words. Higher = catches subtler
                               # flattening, at some precision cost (train prec 0.87).
  monotone_min_words: 3        # word-window width / smallest monotone run flagged
  monotone_window_s: 1.0       # (fallback, no-transcript path) sliding-window length
  monotone_hop_s: 0.25         # (fallback) how far that window steps each reading

evaluation:
  iou_match_threshold: 0.3   # predicted/true interval overlap to count as a hit
